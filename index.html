<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ec" id="metaTheme">
<title>จีนตั้งแต่ศูนย์ · เรียนกับเป่าเป่า 🐼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Prompt:wght@500;600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec;--card:#ffffff;--ink:#2a2320;--mut:#857a72;--line:#f0e2d0;
  --red:#e5484d;--red2:#b9333a;--jade:#12a594;--jade2:#0b7f72;--gold:#f5a524;--gold2:#c97f0a;
  --blue:#3b82f6;--blue2:#2563eb;--bad:#e5484d;--ok:#22a06b;
  --t1:#3b82f6;--t2:#22a06b;--t3:#e08a00;--t4:#e5484d;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans','Noto Sans Thai',system-ui,-apple-system,sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 10% 10%,#ffe9d2 0 80px,transparent 81px),radial-gradient(circle at 90% 30%,#e3f7f2 0 120px,transparent 121px),radial-gradient(circle at 20% 90%,#fde4e4 0 100px,transparent 101px);background-attachment:fixed;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.instep{padding-bottom:24px}
body.instep .bn{display:none}
.fadeup{animation:fadeup .28s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pandawrap{position:relative;cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.pandawrap:hover{transform:scale(1.04)}
.pandawrap:active{transform:scale(.94)}
.pethint{display:inline-block;font-size:.72rem;color:var(--mut);margin-top:4px;font-weight:400}
.mapsvg{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none;z-index:0}
.node{position:relative;z-index:1}
.mo .box.wide{max-width:560px;text-align:left}
h1,h2,h3,.fun{font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif}
.hz{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 24px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,247,236,.88);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-weight:700;font-size:1.05rem;flex:1;min-width:0}
.logo .seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;transform:rotate(-6deg);box-shadow:0 3px 0 var(--red2)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:.92rem;white-space:nowrap}
.stat.fire{color:#ea580c}.stat.fire.off{filter:grayscale(1);opacity:.6}
.stat.xp{color:var(--gold2)}
.topbtn{width:34px;height:34px;padding:0;justify-content:center;cursor:pointer;font-size:.95rem;flex:none}
.shieldpill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff;border:1.5px solid #ffd3a1;color:#b45309;vertical-align:middle}
.fireico{display:inline-block;animation:flame 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}

/* bottom nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn .in{max-width:720px;margin:0 auto;display:flex}
.bn button{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.74rem;color:var(--mut);cursor:pointer;position:relative}
.bn button i{font-style:normal;font-size:1.45rem;line-height:1.3;transition:transform .2s}
.bn button.on{color:var(--red);font-weight:700}
.bn button.on i{transform:translateY(-3px) scale(1.12)}
.bn .lk{position:absolute;top:4px;right:calc(50% - 22px);font-size:.7rem}

/* cards & buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 4px 0 var(--line)}
.btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active,.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--jade);border-color:var(--jade2);color:#fff;box-shadow:0 4px 0 var(--jade2)}
.btn.ok{background:var(--ok);border-color:#17804f;color:#fff;box-shadow:0 4px 0 #17804f}
.btn.bad{background:#fff0f0;border-color:#f4b4b6;color:var(--red2);box-shadow:0 4px 0 #f4b4b6}
.btn.gold{background:var(--gold);border-color:var(--gold2);color:#fff;box-shadow:0 4px 0 var(--gold2)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.big{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-weight:700;font-size:1.2rem;color:#fff;background:var(--red);box-shadow:0 5px 0 var(--red2);cursor:pointer;margin-top:12px;transition:transform .08s,box-shadow .08s}
.big.jade{background:var(--jade);box-shadow:0 5px 0 var(--jade2)}
.big.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--red2),0 0 0 0 rgba(229,72,77,.45)}50%{box-shadow:0 5px 0 var(--red2),0 0 0 12px rgba(229,72,77,0)}}
.sp{border:2px solid var(--line);background:#fff;border-radius:50%;width:46px;height:46px;font-size:1.25rem;cursor:pointer;box-shadow:0 3px 0 var(--line);display:inline-grid;place-items:center;flex:none}
.sp:active{transform:translateY(2px);box-shadow:none}
.mut{color:var(--mut);font-size:.9rem}
.c{text-align:center}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}

/* hero */
.hero{display:flex;align-items:flex-end;gap:6px;margin:4px 0 10px}
.hero .panda{width:150px;flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-weight:600;font-size:1.05rem;margin-bottom:46px;box-shadow:0 4px 0 var(--line);animation:popin .4s ease}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right-color:var(--line)}
.bubble::after{content:"";position:absolute;left:-8px;bottom:19px;border:9px solid transparent;border-right-color:#fff}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* panda */
.panda{display:block;overflow:visible}
.panda .pb{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 190px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.panda .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.panda .arm{transform-box:fill-box;transform-origin:80% 80%}
.panda.happy .arm,.panda.love .arm{animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.panda .m-sad,.panda .m-wow,.panda .brow,.panda .tear,.panda .heart,.panda .zz,.panda .m-angry{display:none}
.panda.sad .m-happy,.panda.angry .m-happy,.panda.wow .m-happy{display:none}
.panda.sad .m-sad,.panda.sad .tear{display:block}
.panda.angry .m-angry,.panda.angry .brow{display:block}
.panda.angry .pb{animation:shake .5s ease-in-out infinite}
.panda.angry .cheek{fill:#ff6b6b}
.panda.wow .m-wow{display:block}
.panda.love .heart{display:block;animation:floatup 1.8s ease-in infinite}
.panda.love .pb,.panda.wow .pb{animation:jump .8s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.panda .tear{animation:drip 1.4s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}

/* mission */
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh small{font-weight:700;color:var(--red);letter-spacing:.5px}
.mh h2{margin:0;font-size:1.4rem}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.tip{background:#fff8e1;border:2px dashed #f5d48a;border-radius:14px;padding:10px 12px;font-size:.93rem;margin:12px 0}
.steps{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.step .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:#f6efe6;flex:none}
.step .st{flex:1;display:flex;flex-direction:column;line-height:1.35}
.step .st small{color:var(--mut)}
.step .sx{font-size:.78rem;font-weight:700;color:var(--gold2)}
.step.ok{background:#effaf4;border-color:#bfe8d2;box-shadow:0 3px 0 #bfe8d2}
.step.ok .si{background:#d6f3e3}
.step.open{border-color:var(--red);box-shadow:0 3px 0 var(--red2);animation:glow 1.8s infinite}
.step.open .si{background:#ffe3e3;animation:wig 1.6s infinite}
@keyframes glow{50%{border-color:#ff9a9e}}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(12deg)}30%{transform:rotate(0)}}
.step.lock{opacity:.55;cursor:not-allowed}
.warn{background:#fff0f0;border:2px solid #f4b4b6;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600;color:var(--red2)}
.streakbox{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3e0,#ffe1c2);border:2px solid #ffd3a1;border-radius:18px;padding:12px 14px;margin-bottom:16px}
.streakbox .f{font-size:2.3rem}
.streakbox b{font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-size:1.25rem}
.week{display:flex;gap:6px;margin-top:6px}
.week span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#fff;border:2px solid #ffd3a1;color:var(--mut)}
.week span.y{background:#ff8a3d;border-color:#ea580c;color:#fff}
.week span.t{outline:2px dashed #ea580c;outline-offset:1px}

/* step screen */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h2{margin:0;font-size:1.3rem;flex:1}
.back{border:0;background:#fff;border:2px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.1rem}
.pbar{height:14px;background:#f1e6d8;border-radius:999px;overflow:hidden;margin:4px 0 16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#3dd6c0);border-radius:999px;transition:width .4s}
.fc{background:#fff;border:2px solid var(--line);border-radius:24px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:20px;box-shadow:0 5px 0 var(--line);transition:transform .3s}
.fc.flipped{animation:flipin .35s ease}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.huge{font-size:4.6rem;line-height:1.15;color:var(--ink)}
.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.py{font-size:1.7rem;font-weight:700;letter-spacing:.5px}
.th{font-size:1.2rem;font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
.acts{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{padding:14px 10px;border:2px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;font-weight:600;box-shadow:0 4px 0 var(--line);font-size:1.02rem;min-height:62px}
.opt .hz{font-size:1.7rem}
.opt.good{background:#dcfce7;border-color:#22a06b;box-shadow:0 4px 0 #22a06b;animation:bounce .4s}
.opt.badx{background:#ffe4e4;border-color:var(--red);box-shadow:0 4px 0 var(--red2);animation:shake .4s}
@keyframes bounce{50%{transform:scale(1.06)}}
.tone-o svg{width:56px;height:36px;display:block;margin:0 auto 2px;fill:none;stroke-width:5;stroke-linecap:round}
.fb{min-height:28px;text-align:center;font-weight:700}
.fb.g{color:var(--ok)}.fb.b{color:var(--red)}

/* match game */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line);min-height:58px;font-weight:600}
.tile .hz{font-size:1.5rem}
.tile.sel{border-color:var(--blue);background:#eaf2ff;box-shadow:0 3px 0 var(--blue2)}
.tile.done{opacity:.25;pointer-events:none;transform:scale(.95);transition:.3s}
.tile.no{animation:shake .4s;border-color:var(--red)}

/* scramble */
.slot{min-height:70px;border:2px dashed #e5d4bf;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fffdf9;margin:10px 0}
.tok{padding:8px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:1.5rem;animation:popin .25s}
.slot.win{border-color:var(--ok);background:#effaf4}
.slot.no{animation:shake .4s;border-color:var(--red)}

/* writing */
.hwbox{width:260px;height:260px;margin:0 auto;border:3px solid var(--red);border-radius:12px;background:#fff;position:relative;
  background-image:linear-gradient(transparent calc(50% - 1px),#f3c9ca calc(50% - 1px),#f3c9ca calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),#f3c9ca calc(50% - 1px),#f3c9ca calc(50% + 1px),transparent calc(50% + 1px))}
.hwbox .ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:200px;color:rgba(0,0,0,.08);pointer-events:none;line-height:1}
.hwbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.chars{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.chars span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--line);background:#fff;font-size:1.5rem}
.chars span.on{border-color:var(--red)}.chars span.ok{background:#dcfce7;border-color:#22a06b}

/* boss */
.arena{background:linear-gradient(180deg,#2b1d3a,#4a2c5e);border-radius:22px;padding:16px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.arena::after{content:"";position:absolute;inset:auto 0 0 0;height:30px;background:linear-gradient(0deg,rgba(0,0,0,.3),transparent)}
.boss{font-size:5rem;text-align:center;line-height:1.1;animation:float 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.boss.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-14px);filter:brightness(3)}60%{transform:translateX(10px)}}
.boss.dead{animation:die 1s forwards}
@keyframes die{to{transform:scale(0) rotate(360deg);opacity:0}}
.hp{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin:6px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5f6d,#ffc371);transition:width .4s}
.hearts{font-size:1.4rem;letter-spacing:2px}
.dmg{position:absolute;left:50%;top:30%;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-weight:700;font-size:2rem;color:#ffd166;animation:dmg 1s forwards;pointer-events:none}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.screenshake{animation:shake .4s}
.qtext{text-align:center;font-size:1.15rem;font-weight:600;margin:6px 0}

/* map */
.map{position:relative;padding:10px 0 30px}
.node{display:flex;flex-direction:column;align-items:center;margin:0 auto 14px;width:120px;cursor:pointer;border:0;background:none}
.node .b{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:700;background:#e9dfd2;color:#a99a8b;box-shadow:0 6px 0 #cfc2b2;border:4px solid #fff;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif}
.node small{font-size:.78rem;color:var(--mut);margin-top:6px;text-align:center;line-height:1.25}
.node.done .b{background:var(--gold);color:#fff;box-shadow:0 6px 0 var(--gold2)}
.node.cur .b{background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red2);animation:pulse2 1.5s infinite}
.node.next .b{background:#9ad8cf;color:#fff;box-shadow:0 6px 0 var(--jade2)}
.node.rev .b{border-color:#c7b6ff}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.node .here{font-size:.75rem;background:var(--red);color:#fff;padding:1px 8px;border-radius:999px;margin-bottom:4px}

/* practice grid */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{border:2px solid var(--line);background:#fff;border-radius:20px;padding:16px 12px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line);position:relative}
.ptile i{font-style:normal;font-size:2.2rem;display:block}
.ptile b{display:block;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif}
.ptile small{color:var(--mut)}
.ptile.locked{filter:grayscale(1);opacity:.6}
.ptile.locked::after{content:"🔒";position:absolute;top:8px;right:10px}
.lockcard{text-align:center;padding:26px 18px}

/* misc lists */
.wl{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.wl .hz{font-size:1.7rem;min-width:2.8em}
.wl .m{flex:1;display:flex;flex-direction:column;line-height:1.35}
.wl .m span{color:var(--mut);font-size:.9rem}
.stars{color:var(--gold);font-size:.8rem;letter-spacing:1px}
.chipg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;padding:10px 6px;background:#fff;border:2px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip b{font-size:1.25rem;color:var(--jade)}.chip small{color:var(--mut);font-size:.76rem;text-align:center}.chip .hz{font-size:1.3rem}
.tones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{background:#fff;border:2px solid var(--line);border-top-width:6px;border-radius:16px;padding:12px;text-align:center}
.tc svg{width:60px;height:40px;fill:none;stroke-width:5;stroke-linecap:round}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 3px 0 var(--line)}
.badge i{font-style:normal;font-size:2rem;display:block}
.badge b{font-size:.82rem;display:block;line-height:1.3}
.badge small{font-size:.72rem;color:var(--mut);line-height:1.2;display:block}
.badge.off{filter:grayscale(1);opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-family:'Noto Sans','Noto Sans Thai','Prompt',sans-serif;font-size:1.5rem}
.stats small{color:var(--mut);font-size:.78rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

const VOWEL_BASE={'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'};
const normPy=s=>[...String(s||'').toLowerCase()].map(c=>VOWEL_BASE[c]||c).join('');
const stripTone=s=>normPy(s).replace(/[^a-zv]/g,'');
const cleanZh=s=>String(s||'').replace(/[，。！？、\s,.!?'"“”‘’()（）]/g,'');
const extractTones=s=>{const ts=[];for(const ch of String(s||''))if(TM[ch])ts.push(TM[ch]);return ts};
function lookupPy(zh){
  const c=cleanZh(zh);
  if(!c)return '';
  if(WD[c])return WD[c][1];
  if(CHAR_PY_MAP[c])return CHAR_PY_MAP[c];
  const parts=[...c].map(ch=>CHAR_PY_MAP[ch]||WD[ch]?.[1]||'');
  return parts.every(Boolean)?parts.join(' '):'';
}
function pronTips(p){
  const n=normPy(p).replace(/[,!?.]+/g,' '),tips=[];
  if(/zh|ch|sh|(?:^|\s)r/.test(n))tips.push('👅 <b>zh / ch / sh / r</b>: ม้วนปลายลิ้นขึ้นแตะเพดานปากบน อย่าปล่อยลิ้นแบน');
  if(/(?:^|\s)[jqx]/.test(n))tips.push('😊 <b>j / q / x</b>: ยิ้มมุมปากเล็กน้อย กดปลายลิ้นหลังฟันล่าง (ห้ามม้วนลิ้น)');
  if(/(?:^|\s)[zcs](?!h)/.test(n))tips.push('🦷 <b>z / c / s</b>: เอาปลายลิ้นชิดหลังฟันบนตรงๆ ออกเสียงคม ไม่ม้วนลิ้น');
  if(/(?:^|\s)(p|t|k|q|ch|c(?!h))/.test(n))tips.push('💨 <b>p / t / k / q / ch / c</b>: เป็นเสียงพ่นลมแรง ลองเอามือป้องปากต้องมีลมออกมา');
  if(/v|[jqxy]u/.test(n))tips.push('😗 <b>สระ ü / u หลัง j q x y</b>: ทำปากจู๋กลมเหมือน "อู" แต่ข้างในออกเสียง "อี"');
  if(/(?:^|\s)h[aeou]/.test(n))tips.push('🗣️ <b>h จีน</b>: เสียดสีในลำคอลึกกว่า ฮ นกฮูกไทยเล็กน้อย');
  if(/\b(h|k|g|m|d|l|n|s|c|z)e\b/.test(n))tips.push('😮 <b>สระ -e</b>: ออกเสียง "เออ" ในลำคอ ไม่ใช่เสียง "เอะ"');
  const ts=extractTones(p);
  if(ts.length){const t=ts[0],td=TN[t-1];tips.push(`🎵 <b>วรรณยุกต์หลัก (${td[0]})</b>: <span style="color:var(${td[3]})">${td[1]}</span>`)}
  return tips.length?tips:['🔊 กดฟังช้า 🐢 แล้วออกเสียงตามให้จังหวะชัดทีละพยางค์'];
}
function analyzeSpeechResult(targetHz,targetPy,alts){

function detectPitchNSDF(buf,sr){
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<.015)return{hz:null,rms};
  const minLag=Math.max(16,Math.floor(sr/500)),maxLag=Math.min(buf.length-32,Math.ceil(sr/75));
  let bestLag=0,bestR=0,firstPeakLag=0;const rs=new Float32Array(maxLag+1);
  for(let lag=minLag;lag<=maxLag;lag++){
    let dot=0,a2=0,b2=0;const lim=buf.length-lag;
    for(let i=0;i<lim;i++){const a=buf[i],b=buf[i+lag];dot+=a*b;a2+=a*a;b2+=b*b}
    const r=(a2>0&&b2>0)?dot/Math.sqrt(a2*b2):0;rs[lag]=r;
    if(r>bestR){bestR=r;bestLag=lag}
  }
  if(bestR<.75)return{hz:null,rms};
  for(let lag=minLag+1;lag<maxLag;lag++){
    if(rs[lag]>=bestR*.92&&rs[lag]>=rs[lag-1]&&rs[lag]>=rs[lag+1]){firstPeakLag=lag;break}
  }
  const lag=firstPeakLag||bestLag;
  if(lag<=minLag||lag>=maxLag)return{hz:sr/lag,rms};
  const denom=2*(rs[lag-1]-2*rs[lag]+rs[lag+1]);
  const shift=denom?((rs[lag-1]-rs[lag+1])/denom)*.5:0;
  return{hz:sr/(lag+(Math.abs(shift)<1?shift:0)),rms};
}
function drawPitchGraph(canvasId,toneIdx,stPts){

  const dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();
  if(!r.width||!r.height)return;
  c.width=r.width*dpr;c.height=r.height*dpr;
  const ctx=c.getContext('2d'),w=c.width,h=c.height,padX=16*dpr,padY=16*dpr,cw=w-padX*2,ch=h-padY*2;
  const mapY=val=>padY+(1-(val+7)/14)*ch;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(133,122,114,.22)';ctx.lineWidth=1*dpr;
  [-4,0,4].forEach(v=>{const y=mapY(v);ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(w-padX,y);ctx.stroke()});
  const refs=[()=>3.5,t=>-3+7*t,t=>-1-3.5*Math.sin(Math.PI*Math.pow(t,.75))+2*Math.pow(t,2),t=>4.5-9.5*t];

    ctx.beginPath();stPts.forEach((p,i)=>{const x=padX+p.p*cw,y=Math.max(padY,Math.min(h-padY,mapY(p.st)));i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  }

function evaluatePitchContour(pts,targetToneIdx){
  if(pts.length<6)return{ok:false,stPts:[],msg:'ได้ยินเสียงสั้นหรือเบาเกินไป ลองพูดค้างจังหวะให้เต็มคำสัก 1 วินาทีนะ'};
  const medRaw=pts.map(p=>p.hz).slice().sort((a,b)=>a-b)[Math.floor(pts.length/2)];
  const smooth=pts.map((p,i)=>{const win=pts.slice(Math.max(0,i-1),Math.min(pts.length,i+2)).map(x=>x.hz).sort((a,b)=>a-b);return{t:p.t,hz:win[Math.floor(win.length/2)]}});
  const t0=smooth[0].t,span=Math.max(1,smooth[smooth.length-1].t-t0);
  const stPts=smooth.map(p=>({p:(p.t-t0)/span,st:12*Math.log2(p.hz/medRaw)}));
  const avg=arr=>arr.reduce((s,v)=>s+v,0)/arr.length;
  const q1=Math.max(2,Math.floor(stPts.length*.28)),q3=Math.max(2,Math.floor(stPts.length*.28));
  const sStart=avg(stPts.slice(0,q1).map(x=>x.st)),sEnd=avg(stPts.slice(-q3).map(x=>x.st));
  const minSt=Math.min(...stPts.map(x=>x.st)),maxSt=Math.max(...stPts.map(x=>x.st));
  const delta=sEnd-sStart,dip=Math.min(sStart,sEnd)-minSt,spread=maxSt-minSt;
  let detected=0;
  if(delta>=1.7)detected=1;
  else if(delta<=-2.0)detected=3;
  else if(dip>=1.4)detected=2;
  else if(spread<=4.0&&Math.abs(delta)<1.8)detected=0;
  else detected=delta>0?1:(dip>.9?2:3);
  const ok=detected===targetToneIdx||(targetToneIdx===2&&(dip>=1.1||(delta<=-.8&&minSt<-1.2&&sEnd>minSt+.5)));
  const targetName=TN[targetToneIdx][0],detName=TN[detected][0],dStr=(delta>=0?'+':'')+delta.toFixed(1);
  return{ok,stPts,msg:ok
    ?`✅ เส้นเสียงตรงแนว <b>${targetName}</b> (${TN[targetToneIdx][1]} · เปลี่ยนระดับ ${dStr} ครึ่งเสียง)`
    :`กราฟวัดแนวเสียงคล้าย <b>${detName}</b> (เปลี่ยน ${dStr} ครึ่งเสียง) แต่เป้าหมายคือ <b>${targetName} (${TN[targetToneIdx][1]})</b> — ลองปรับเทียบตามเส้นประสีทองดูนะ!`};
}
function startPitchCheck(toneIdx,canvasId,vuId,fbId,btnId){
  stopActiveAudioMonitors();
  const fb=document.getElementById(fbId),vu=document.getElementById(vuId),btn=document.getElementById(btnId);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(fb){fb.className='fb b';fb.textContent='เบราว์เซอร์นี้ไม่รองรับการเข้าถึงไมโครโฟน (getUserMedia)'}return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(stream=>{
    try{
      AC=AC||new(window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      const src=AC.createMediaStreamSource(stream),an=AC.createAnalyser();
      an.fftSize=2048;src.connect(an);
      const buf=new Float32Array(an.fftSize),pts=[],startMs=performance.now(),maxMs=2000;
      let stopped=false,rafId=0;
      const finish=(cancelled=false)=>{
        if(stopped)return;stopped=true;cancelAnimationFrame(rafId);
        try{src.disconnect()}catch(_){}
        stream.getTracks().forEach(t=>t.stop());
        if(MIC_REC&&MIC_REC.stopNow===finish)MIC_REC=null;
        if(btn){btn.classList.remove('rec-pulse');btn.textContent='📈 จับกราฟเสียงไมค์ (2 วิ)'}
        if(vu)vu.style.width='0%';
        if(cancelled)return;
        const ev=evaluatePitchContour(pts,toneIdx);
        drawPitchGraph(canvasId,toneIdx,ev.stPts);
        if(fb){fb.className='fb '+(ev.ok?'g':'b');fb.innerHTML=ev.msg}
        ev.ok?sfx.ok():sfx.bad();
      };
      MIC_REC={stopNow:finish};
      if(btn){btn.classList.add('rec-pulse');btn.textContent='⏹️ กำลังฟัง... แตะเพื่อหยุด'}
      if(fb){fb.className='fb';fb.textContent='🎙️ พูดคำนี้ค้าง ~1 วินาทีได้เลย!'}
      (function loop(){
        if(stopped)return;
        an.getFloatTimeDomainData(buf);
        const{hz,rms}=detectPitchNSDF(buf,AC.sampleRate),elap=performance.now()-startMs;

        if(pts.length>=2){
          const med=pts.map(p=>p.hz).slice().sort((a,b)=>a-b)[Math.floor(pts.length/2)];

      stream.getTracks().forEach(t=>t.stop());
      if(fb){fb.className='fb b';fb.textContent='ไม่สามารถเริ่มต้นระบบวิเคราะห์เสียงได้'}
    }
  }).catch(()=>{
    if(fb){fb.className='fb b';fb.textContent='ไม่ได้รับอนุญาตใช้ไมโครโฟน หรือเบราว์เซอร์บล็อกสิทธิ์ในโหมด file:// (แนะนำเปิดผ่าน localhost/Chrome)'}
  });
}

let VIEW='home',X={},after=null,timer=null,DISP_XP=S.xp;
function go(v){stopActiveAudioMonitors();VIEW=v;X={};render();window.scrollTo({top:0,behavior:'smooth'})}
function act(h){const a=$('#act');if(a)a.innerHTML=h}
function applyTheme(){
  document.body.classList.toggle('dark',!!S.dark);
  const bm=$('#btnMute'),bd=$('#btnDark'),mt=$('#metaTheme');
  if(bm)bm.textContent=S.muted?'🔇':'🔊';
  if(bd)bd.textContent=S.dark?'☀️':'🌙';
  if(mt)mt.setAttribute('content',S.dark?'#1c1917':'#fff7ec');
}
function rollXP(from,to){
  const el=$('#sXp');if(!el)return;
  if(from===to||window.matchMedia('(prefers-reduced-motion: reduce)').matches){DISP_XP=to;el.innerHTML=`⭐ ${to} <small style="color:var(--mut);font-weight:600">Lv${level()}</small>`;return}
  const st=performance.now(),dur=480;
  (function step(now){
    const k=Math.min(1,(now-st)/dur),v=Math.round(from+(to-from)*k);
    el.innerHTML=`⭐ ${v} <small style="color:var(--mut);font-weight:600">Lv${Math.floor(v/120)+1}</small>`;
    if(k<1)requestAnimationFrame(step);else DISP_XP=to;
  })(st);
}
function topbar(){
  applyTheme();
  const doneT=S.today&&(S.today.done||S.today.quickDone);
  $('#sStreak').className='stat fire'+(S.streak?'':' off');
  $('#sStreak').innerHTML=`<span class="fireico">🔥</span>${S.streak}`;
  if(DISP_XP!==S.xp)rollXP(DISP_XP,S.xp);
  else $('#sXp').innerHTML=`⭐ ${S.xp} <small style="color:var(--mut);font-weight:600">Lv${level()}</small>`;
  const tabs=[['home','🏠','วันนี้'],['map','🗺️','แผนที่'],['practice','🎮','ฝึกเพิ่ม'],['awards','🏆','รางวัล'],['settings','⚙️','ตั้งค่า']];
  const base=VIEW.split(':')[0];const cur=base==='step'?'home':base==='pr'?'practice':base==='lesson'?'map':base;
  $('#bn').innerHTML=tabs.map(([k,i,n])=>`<button class="${k===cur?'on':''}" data-a="go" data-x="${k}"><i>${i}</i>${n}${k==='practice'&&!doneT?'<span class="lk">🔒</span>':''}</button>`).join('');
}
function render(){
  stopActiveAudioMonitors();clearInterval(timer);after=null;document.body.classList.toggle('instep',VIEW.startsWith('step:'));topbar();
  const [a,b,c]=VIEW.split(':');let h='';
  if(a==='home')h=vHome();else if(a==='map')h=vMap();else if(a==='practice')h=vPractice();else if(a==='awards')h=vAwards();else if(a==='settings')h=vSettings();
  else if(a==='step')h=vStep(b);else if(a==='pr')h=vPr(b,c);else if(a==='lesson')h=vLesson(+b);
  const m=$('#main');m.innerHTML=h;m.classList.remove('fadeup');void m.offsetWidth;m.classList.add('fadeup');if(after)after();
}
function ring(p){const r=26,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" stroke="#f1e6d8"/><circle cx="32" cy="32" r="${r}" stroke="var(--jade)" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" stroke-linecap="round" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .6s"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${Math.round(p*6)}/6</text></svg>`}
const pbar=p=>`<div class="pbar"><i style="width:${Math.round(p*100)}%"></i></div>`;
function untilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,(m-n)/1000);return `${Math.floor(s/3600)} ชม. ${Math.floor(s%3600/60)} นาที`}

function vStep(id){
  if(id==='quick'){
    if(!S.today.started){S.today.started=true;save()}
    after=()=>ACT.quick.start();
    return `<div class="sh"><button class="back" data-a="quit">✕</button><h2>⚡ โหมดย่อ 2 นาที</h2><button class="btn sm" data-a="cheat" title="ดูคู่มือเสียงและพินอิน">📘 คู่มือ</button><span class="mut">รักษาสตรีค</span></div><div id="act"></div>`;
  }
  const s=STEPS.find(x=>x.id===id),i=STEPS.indexOf(s);
  if(i>0&&!S.today.steps[STEPS[i-1].id]&&!S.today.steps[id]){setTimeout(()=>go('home'),0);return ''}
  if(!S.today.started){S.today.started=true;save()}
  after=()=>ACT[id].start();
  return `<div class="sh"><button class="back" data-a="quit">✕</button><h2>${s.ic} ${s.n}</h2><button class="btn sm" data-a="cheat" title="ดูคู่มือเสียงและพินอิน">📘 คู่มือ</button><span class="mut">${i+1}/6</span></div><div id="act"></div>`;
}
function finishStep(id){
  const T=S.today;const first=!T.steps[id];
  if(first){T.steps[id]=1;const s=STEPS.find(x=>x.id===id);S.xp+=s.xp;save();topbar();xpFly('+'+s.xp+' XP')}
  sfx.win();
  if(STEPS.every(s=>T.steps[s.id])&&!T.done){completeDay();return}
  const next=STEPS.find(s=>!T.steps[s.id]);
  modal(`${panda('love')}<h2>${pick(['เยี่ยมมาก!','太棒了! สุดยอด!','เก่งมาก!','ไปต่อเลย!'])}</h2><p>ผ่านขั้น "${STEPS.find(x=>x.id===id).n}" แล้ว</p>${next?`<button class="big" data-a="mgo" data-x="step:${next.id}">ขั้นต่อไป: ${next.ic} ${next.n} ▶</button>`:''}<button class="btn" style="margin-top:12px" data-a="mgo" data-x="home">กลับหน้าหลัก</button>`);
}
function completeQuick(){
  const T=S.today,t=TODAY();
  if(!T.quickDone){
    T.quickDone=true;T.skipped=false;S.hist[t]=1;
    if(S.lastDone!==t){S.streak+=1;S.daysDone+=1;S.best=Math.max(S.best,S.streak);S.lastDone=t}
    S.xp+=15;checkBadges();save();topbar();xpFly('+15 XP');
  }
  sfx.win();confetti();
  modal(`${panda('love')}<h2>⚡ โหมดย่อ 2 นาทีสำเร็จ!</h2><p style="font-size:1.05rem">🔥 รักษาสตรีค <b>${S.streak} วัน</b> ไว้ได้แล้ว · ปลดล็อกโหมดฝึกเพิ่มแล้ว</p><p class="mut">ถ้าพอมีเวลา แนะนำทำภารกิจหลัก 6 ขั้นต่อเพื่อขึ้นวันถัดไปนะ</p><button class="big jade" data-a="mgo" data-x="home">เยี่ยม! กลับหน้าหลัก 🐼</button>`);
}
function completeDay(){
  const T=S.today,t=TODAY();
  T.done=true;T.skipped=false;S.hist[t]=1;
  if(S.lastDone!==t){S.streak+=1;S.daysDone+=1}
  S.day+=1;
  if(T.penalty)S.flags.comeback=true;
  S.best=Math.max(S.best,S.streak);S.lastDone=t;
  const hr=new Date().getHours();if(hr<9)S.flags.early=true;if(hr>=22)S.flags.night=true;
  S.xp+=20;
  const nb=checkBadges();save();topbar();confetti();
  modal(`${panda('love')}<h2>🎉 จบ Day ${T.day} แล้ว!</h2><p style="font-size:1.1rem">🔥 <b>${S.streak} วันติดต่อกัน</b> · ⭐ +20 XP โบนัส</p>${nb.length?`<p>ได้เหรียญใหม่: ${nb.map(b=>b[1]+' '+b[2]).join(', ')}</p>`:''}<p class="mut">พรุ่งนี้ Day ${S.day} รออยู่นะ อย่าหนีล่ะ! 明天见!</p><button class="big jade" data-a="mgo" data-x="home">เย้! 🐼</button>`);
}
function checkBadges(){const nb=[];BADGES.forEach(b=>{if(!S.badges.includes(b[0])&&b[4](S)){S.badges.push(b[0]);nb.push(b)}});return nb}

function buildReview(){
  const t=TODAY(),pen=S.today.penalty;
  let due=Object.keys(S.srs).filter(h=>S.srs[h].due<=t).sort((a,b)=>S.srs[a].b-S.srs[b].b);
  const cap=pen?30:15;due=due.slice(0,cap);
  if(pen){const need=Math.min(Object.keys(S.srs).length,20);const rest=sh(Object.keys(S.srs).filter(h=>!due.includes(h)));while(due.length<need&&rest.length)due.push(rest.pop())}
  return sh(due).map(h=>WD[h]).filter(Boolean);
}

let HWp=null;
function loadHW(){if(window.HanziWriter)return Promise.resolve(true);if(HWp)return HWp;HWp=new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js';s.onload=()=>r(true);s.onerror=()=>{HWp=null;r(false)};document.head.appendChild(s);setTimeout(()=>r(!!window.HanziWriter),4000)});return HWp}
function setupWriter(ch,onDone){
  const tok=(X.wToken=(X.wToken||0)+1);
  loadHW().then(ok=>{
    if(X.wToken!==tok)return;
    const box=$('#hw');if(!box)return;
    if(!ok){canvasWriter(ch,onDone);return}
    let failed=false,manual=false;
    const w=HanziWriter.create(box,ch,{width:254,height:254,padding:14,showOutline:true,strokeColor:'#e5484d',outlineColor:'#eadfd3',drawingColor:'#2a2320',highlightColor:'#12a594',strokeAnimationSpeed:1,delayBetweenStrokes:250,drawingWidth:22,showHintAfterMisses:2,onLoadCharDataError:()=>{if(X.wToken!==tok)return;failed=true;box.innerHTML='';canvasWriter(ch,onDone)}});
    X.writer=w;
    const quiz=()=>{if(X.wToken!==tok||failed)return;manual=true;$('#fb').className='fb';$('#fb').textContent='เขียนตามลำดับขีดในกรอบ (ผิด 2 ครั้งจะมีคำใบ้)';w.quiz({onMistake:()=>sfx.bad(),onCorrectStroke:()=>sfx.tap(),onComplete:s=>{if(X.wToken!==tok)return;$('#fb').textContent='';onDone(s)}})};
    X.wq=quiz;
    X.wanim=()=>{if(X.wToken!==tok||failed)return;manual=true;w.cancelQuiz&&w.cancelQuiz();w.animateCharacter({onComplete:()=>{if(X.wToken===tok&&!X.ok[X.i])setTimeout(quiz,350)}})};
    setTimeout(()=>{if(X.wToken!==tok||failed||!$('#wbtn'))return;$('#wbtn').innerHTML='<button class="btn" data-a="wanim">▶️ ดูลำดับขีดอีกครั้ง</button><button class="btn main" data-a="wquiz">✍️ ลองเขียนเอง</button>';
      w.animateCharacter({onComplete:()=>{if(X.wToken===tok&&!manual)setTimeout(quiz,450)}})},300);
  });
}
function canvasWriter(ch,onDone){
  const box=$('#hw');box.innerHTML=`<div class="ghost hz">${ch}</div><canvas></canvas>`;
  const c=box.querySelector('canvas'),d=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;
  const x=c.getContext('2d');x.strokeStyle='#2a2320';x.lineWidth=9*d;x.lineCap=x.lineJoin='round';let drawing=false,strokes=0;
  const P=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*d,(e.clientY-b.top)*d]};
  c.onpointerdown=e=>{e.preventDefault();drawing=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const p=P(e);x.beginPath();x.moveTo(p[0],p[1])};
  c.onpointermove=e=>{if(!drawing)return;const p=P(e);x.lineTo(p[0],p[1]);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(drawing){drawing=false;strokes++;if(strokes>=1&&$('#wdone'))$('#wdone').disabled=false}};
  $('#wbtn').innerHTML='<button class="btn" data-a="wclr">ล้าง</button><button class="btn main" id="wdone" data-a="wcanvas" disabled>เขียนเสร็จแล้ว</button>';
  $('#fb').className='fb';$('#fb').textContent='(โหมดเขียนอิสระ) เขียนทับตัวจางให้ครบทุกขีด';
  X.cv={x,c,onDone};
}

function vPr(id,fromDay){

  const back=`<div class="sh"><button class="back" data-a="go" data-x="${backTarget}">←</button><h2>${{cards:'🃏 แฟลชการ์ด',tone:'👂 ฝึกหูวรรณยุกต์',write:'✍️ คัดเขียนอิสระ',words:'📖 คลังศัพท์ของฉัน',guide:'📘 คู่มือเสียง',speech:'🎤 ช่วยออกเสียง'}[id]||'✍️ คัดเขียน'}</h2>${id==='speech'?'<span class="stat xp" id="prsPill">ผ่าน 0 ข้อ</span>':''}</div>`;
  if(id!=='guide'&&id!=='speech'&&!(S.today.done||S.today.quickDone)&&!id.startsWith('w-')){setTimeout(()=>go('practice'),0);return ''}

  if(id==='words'){

    return back+boxBar+(ws.length?ws.sort((a,b)=>S.srs[a[0]].b-S.srs[b[0]].b).map(w=>{const r=S.srs[w[0]];const bx=Math.min(5,Math.max(1,(r.b||0)+1));return `<div class="wl"><span class="hz">${w[0]}</span><span class="m"><b>${py(w[1])}</b><span>${w[2]}</span><small class="mut" style="font-size:.74rem">กล่อง ${bx}/5 · รอบถัดไป ${r.due}</small></span><span class="stars">${'★'.repeat(r.b)}${'☆'.repeat(5-r.b)}</span>${spk(w[0])}</div>`}).join(''):'<p class="mut c">ยังไม่มีคำศัพท์</p>')
  }
  if(id==='cards'){after=()=>{X={q:sh(learnedWords()),flip:false,n:0};prCards()};return back+'<div id="act"></div>'}
  if(id==='tone'){after=()=>{X={ok:0,tot:0,q:toneQ(),free:1};prTone();setTimeout(()=>say(X.q.h),300)};return back+'<div id="act"></div>'}
  if(id==='write'){const chars=[];CUR.slice(0,Math.max(S.day-1,(S.today.done||S.today.quickDone)?S.today.day:S.today.day-1)).forEach(L=>L.c.forEach(c=>{if(!chars.some(x=>x[0]===c[0]))chars.push(c)}));
    return back+(chars.length?`<div class="row2">${chars.map(c=>`<button class="btn" data-a="go" data-x="pr:w-${c[0]}"><span class="hz" style="font-size:1.5rem">${c[0]}</span></button>`).join('')}</div>`:'<p class="mut c">ยังไม่มีตัวอักษร</p>')}

  return back;

function buildPronList(deck){
  if(deck==='traps')return PRON_TRAPS.map(([h,p,t])=>({h,p,t}));
  if(deck==='tones')return TS.flatMap(s=>[...s.h].map((h,k)=>({h,p:s.p[k],t:s.m[k],set:s})));
  if(deck==='sentences'){const lim=Math.max(1,(S.today&&S.today.done)?S.today.day:S.day);return CUR.slice(0,lim).map(L=>({h:L.s[0].replace(/ /g,''),p:L.s[1],t:L.s[2]}))}
  const lw=learnedWords();const src=lw.length?lw:CUR.slice(0,Math.max(1,S.day)).flatMap(L=>L.w);
  return src.map(([h,p,t])=>({h,p,t}));
}

function modal(h,cls){$('#mo').innerHTML=`<div class="mo"><div class="box ${cls||''}">${h}</div></div>`}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function xpFly(t){const d=document.createElement('div');d.className='xpfly';d.textContent=t;d.style.left='50%';d.style.top='40%';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#e5484d','#f5a524','#12a594','#3b82f6','#ff8fa3','#ffd166'];
  const P=[...Array(160)].map(()=>({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:Math.random()*8+4,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

function gate(ev){

  if(ev&&ev.type==='shield'){modal(`${panda('wow')}<h2>🛡️ เกือบไปแล้ว! การ์ดป้องกันช่วยไว้ทัน</h2><p>เมื่อวานคุณไม่ได้เข้ามาเรียน แต่ระบบใช้ <b>การ์ดป้องกันสตรีค (1 ใบ/สัปดาห์)</b> รักษาไฟ 🔥 <b>${ev.streak} วัน</b> ไว้ให้แล้ว!</p><button class="big jade" data-a="mgo" data-x="home">ขอบคุณ! วันนี้จะเรียนเลย ▶</button>`);return}

  if(ev&&ev.type==='missed'){modal(`${panda('sad')}<h2>เป่าเป่ารอตั้ง ${ev.gap} วัน 😢</h2><p>อย่าหายไปอีกนะ วันนี้ต้องทบทวนเพิ่ม 2 เท่า</p><button class="big" data-a="mgo" data-x="home">โอเค จะเรียนแล้ว</button>`);return}

}

      })},
    prsdeck:()=>{X.pr.deck=x;X.pr.i=0;X.pr.lastRes=null;X.pr.lastPts=[];X.pr.mood='happy';startPrSpeech()},
    prsjump:()=>{const idx=X.pr.list.findIndex(item=>item.h===x);if(idx>=0){X.pr.i=idx;X.pr.lastRes=null;X.pr.lastPts=[];X.pr.mood='happy';drawPrSpeech();say(x)}},
    prsprev:()=>{X.pr.i=(X.pr.i-1+X.pr.list.length)%X.pr.list.length;X.pr.lastRes=null;X.pr.lastPts=[];X.pr.mood='happy';drawPrSpeech()},
    prsnext:()=>{X.pr.i=(X.pr.i+1)%X.pr.list.length;X.pr.lastRes=null;X.pr.lastPts=[];X.pr.mood='happy';drawPrSpeech()},
    prsrand:()=>{X.pr.i=Math.floor(Math.random()*X.pr.list.length);X.pr.lastRes=null;X.pr.lastPts=[];X.pr.mood='happy';drawPrSpeech()},
    prsmic:()=>{const pr=X.pr,w=pr.list[pr.i],box=$('#prsBox'),btn=$('#btnPrsMic'),pw=$('#prsPanda');
      runSpeechCheck(w.h,w.p,{
        onListening:()=>{pr.mood='wow';if(pw)pw.innerHTML=panda('wow');if(btn){btn.classList.add('rec-pulse');btn.textContent='🎙️ กำลังฟัง... พูดเลย!'}if(box)box.innerHTML='<div class="mut">🎤 กำลังรับเสียงพูดภาษาจีน (zh-CN)...</div>'},
        onInterim:t=>{if(box)box.innerHTML=`<div class="mut">ได้ยินเบื้องต้น: <span class="hz">${esc(t)}</span>…</div>`},
        onResult:r=>{if(btn){btn.classList.remove('rec-pulse');btn.textContent='🎤 พูดตาม & ตรวจคำจีน'}pr.lastRes=r;
          if(r.status==='ok'){pr.passed[w.h]=true;pr.mood='love';sfx.ok()}
          else if(r.status==='tone'||r.status==='near'){pr.mood='wow';sfx.bad()}
          else{pr.mood='sad';sfx.bad()}
          if(pw)pw.innerHTML=panda(pr.mood);
          const pill=$('#prsPill');if(pill)pill.textContent=`ผ่าน ${Object.keys(pr.passed).length} ข้อ`;
          if(box)box.innerHTML=renderPronCmp(r,w.h,w.p)},
        onError:m=>{if(btn){btn.classList.remove('rec-pulse');btn.textContent='🎤 พูดตาม & ตรวจคำจีน'}pr.mood='sad';if(pw)pw.innerHTML=panda('sad');if(box)box.innerHTML=`<div class="fb b">${esc(m)}</div>`;sfx.bad()}
      })},
    prspitch:()=>{if(MIC_REC){MIC_REC.stopNow(false);return}startPitchCheck(+x,'pitchCv','vuFill','pitchFb','btnPrsPitch')},
    sgo:()=>{if(X.heard<2){toast('ฟังให้ครบ 2 รอบก่อน 🔊');return}X.phase='order';ACT.sent.draw()},
    spick:()=>{const p=X.pool.find(p=>p.i===+x);X.ans.push(p);sfx.tap();ACT.sent.draw()},
    sback:()=>{X.ans.splice(+x,1);ACT.sent.draw()},
    sclr:()=>{X.ans=[];ACT.sent.draw()},
    schk:()=>{const ok=X.ans.map(a=>a.t).join('')===X.toks.join('');const sl=$('#slot'),v=VIEW;
      if(ok){sl.classList.add('win');sfx.ok();say(X.L.s[0]);$('#fb').className='fb g';$('#fb').innerHTML='ถูกต้อง! 🎉';setTimeout(()=>VIEW===v&&finishStep('sent'),1300)}
      else{sl.classList.add('no');sfx.bad();$('#fb').className='fb b';$('#fb').textContent='ลำดับยังไม่ถูก ลองฟังอีกครั้ง';setTimeout(()=>{if(VIEW!==v)return;X.ans=[];ACT.sent.draw()},900)}},
    wanim:()=>{if(X.wanim)X.wanim();else if(X.writer){X.writer.cancelQuiz&&X.writer.cancelQuiz();X.writer.animateCharacter()}},
    wquiz:()=>{X.wq&&X.wq()},
    wnext:()=>{X.i++;ACT.write.draw()},
    wclr:()=>{const v=X.cv;if(v)v.x.clearRect(0,0,v.c.width,v.c.height)},
    wcanvas:()=>{X.cv&&X.cv.onDone()},
    bans:()=>{if(X.lock)return;X.lock=true;const q=X.qs[X.i],k=+x,ok=q.opts[k]===q.w,v=VIEW;const os=document.querySelectorAll('.opt');os.forEach((o,j)=>{if(q.opts[j]===q.w)o.classList.add('good')});
      const fb=$('#fb');
      if(ok){X.hp--;sfx.ok();const bo=$('#boss');bo.classList.add('hit');const d=document.createElement('div');d.className='dmg';d.textContent='-1 💥';$('#arena').appendChild(d);fb.className='fb g';fb.innerHTML=`${q.w[0]} ${py(q.w[1])} = ${q.w[2]}`}
      else{os[k].classList.add('badx');X.hearts--;X.lost++;X.missed.push(q);srsUp(q.w[0],false);sfx.bad();$('#main').classList.add('screenshake');setTimeout(()=>$('#main').classList.remove('screenshake'),400);fb.className='fb b';fb.innerHTML=`โดนโจมตี! 💔 คำตอบคือ ${q.w[0]} ${py(q.w[1])} = ${q.w[2]}`}
      say(q.w[0]);setTimeout(()=>{if(VIEW!==v)return;X.lock=false;X.i++;ACT.boss.draw()},ok?1100:1900)},
    bretry:()=>ACT.boss.start(),
    bretrywrong:()=>{X.qs=sh(X.missed);X.i=0;X.missed=[];X.retryPass=true;X.hp=X.qs.length;X.max=X.qs.length;X.hearts=Math.max(1,X.hearts);ACT.boss.draw()},
    bwin:()=>{if(X.lost===0)S.flags.perfect=true;save();finishStep('boss')},
    node:()=>{const d=+x;if(d<S.day||(d===S.today.day&&(S.today.done||S.today.quickDone)))go('lesson:'+d);else if(d===S.today.day)go('home');else{sfx.bad();toast(d===S.day?'⏰ ปลดล็อกพรุ่งนี้ อย่าลืมมานะ!':'🔒 ด่านนี้ยังไม่ถึง เรียนวันละ 1 ด่าน')}},
    cflip:()=>{X.flip=true;prCards();say(X.q[0][0])},
    cyes:()=>{X.q.shift();X.n++;X.flip=false;sfx.ok();prCards()},
    cno:()=>{X.q.push(X.q.shift());X.flip=false;prCards()},
    saveset:()=>{S.name=$('#fName').value.trim()||S.name;S.goal=$('#fGoal')?.value||S.goal;S.time=$('#fTime').value||S.time;save();toast('บันทึกแล้ว ✅');topbar()},
    ics:()=>makeICS(),
    notif:()=>{if(!('Notification' in window)){toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน');return}Notification.requestPermission().then(p=>toast(p==='granted'?'เปิดแจ้งเตือนแล้ว 🔔':'ไม่ได้รับอนุญาต'))},
    export:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chinese-backup-${TODAY()}.json`;document.body.appendChild(a);a.click();a.remove();toast('ดาวน์โหลดไฟล์สำรองแล้ว 💾')},
    reset:()=>{const t=prompt('พิมพ์คำว่า "เริ่มใหม่" เพื่อยืนยันการลบข้อมูลทั้งหมด');if(t==='เริ่มใหม่'){localStorage.removeItem(KEY);location.reload()}},
    obdone:()=>{const n=$('#oName').value.trim();if(!n){toast('บอกชื่อเล่นก่อนนะ 🐼');return}if(!$('#oPledge').checked){toast('ต้องสัญญาก่อนนะ! ✋');sfx.bad();return}
      S.name=n;S.goal=$('#oGoal')?.value||GOALS[0];S.time=$('#oTime').value||'20:00';save();
      modal(`${panda('love')}<h2>สัญญาแล้วนะ ${esc(n)}! 🤝</h2><p>🎯 เป้าหมาย: <b>${esc(S.goal)}</b></p><p class="mut">แนะนำให้กด <b>เพิ่มลงปฏิทิน</b> และตั้งปลุกมือถือคู่กันทุกวันตอน ${S.time} น.</p><button class="btn gold" data-a="ics">📅 เพิ่มลงปฏิทิน</button><button class="big" data-a="mgo" data-x="step:review">เริ่ม Day 1 เลย ▶</button>`)}
  };
  if(H[a])H[a]();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.day!=='number'||!d.srs)throw 0;S=Object.assign({},DEF,d);S.flags=S.flags||{};S.skips=Array.isArray(S.skips)?S.skips:[];if(typeof S.shields!=='number')S.shields=1;S.goal=S.goal||GOALS[0];S.muted=!!S.muted;S.dark=!!S.dark;applyTheme();save();toast('กู้คืนข้อมูลสำเร็จ ✅');const ev=ensureMission();go('home');gate(ev)}catch(err){toast('ไฟล์ไม่ถูกต้อง ❌');sfx.bad()}};r.readAsText(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='oName')$('#oPledge')?.focus()});

/* nag when leaving / tab hidden */
const TITLE=document.title;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.today&&!S.today.done)document.title='😭 กลับมาเรียนก่อน! · เป่าเป่ารออยู่';else document.title=TITLE});
window.addEventListener('beforeunload',e=>{if(S.today&&S.today.started&&!S.today.done){e.preventDefault();e.returnValue='ยังเรียนไม่ครบนะ!';return e.returnValue}});
setInterval(()=>{
  if(S.today&&S.today.date!==TODAY()){const ev=ensureMission();go('home');gate(ev);return}
  const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if('Notification' in window&&Notification.permission==='granted'&&!S.today.done&&hm>=S.time&&S.notified!==TODAY()){S.notified=TODAY();save();try{new Notification('🐼 ถึงเวลาเรียนจีนแล้ว!',{body:`Day ${S.today.day}: ${lesson().t} — ห้ามหนีนะ!`})}catch(e){}}
},60000);

/* boot */
const EV=ensureMission();
render();
gate(EV);
</script>
</body>
</html>
